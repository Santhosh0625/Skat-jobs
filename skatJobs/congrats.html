<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎉Congratulations</title>
    <link
      href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header flex items-start justify-start bg-white p-4">
      <img
        src="https://img.icons8.com/ios-filled/50/0066FF/briefcase.png"
        alt="Logo"
      />
      <h2 class="text-xl font-bold">SkatJobs</h2>
    </header>

    <div class="absolute top-4 right-4 w-72 mr-40">
      <div class="flex justify-between text-sm font-medium text-gray-500 mb-1">
        <span>Setup Progress</span>
        <span class="text-[#0066FF]">100% Completed</span>
      </div>
      <progress
        value="100"
        max="100"
        class="w-full h-2 rounded-full"
      ></progress>
    </div>

    <div class="flex justify-center items-center h-screen">
      <div class="bg-white max-w-md w-full">
        <div class="flex justify-center pb-8">
          <img src="assets/tick.png" />
        </div>
        <h1 class="text-xl font-bold mb-4 text-center">
          🎉Congratulations, Your profile is 100% complete!
        </h1>
        <p class="text-gray-400 mb-6 text-center">
          donec hendrit, ante mattis pellentesque eleifend, tortor urna
          malesuada ante, eget aliquam nulla augue hendrerit ligula. Nunc mauris
          arcu, mattis sem vitae
        </p>
        <div class=" flex gap-6 pl-10">
          <button
            onclick="window.location.href='index.html'"
            class="bg-indigo-50 text-blue-600 px-4 py-2"
          >
            View Dashboard
          </button>
          <button class="bg-blue-500 text-white px-4 py-2">
            Post Job <i class="fa-solid fa-arrow-right w-4 h-4 ml-3 mt-1"></i>
          </button>
        </div>
      </div>
    </div>

    <footer class="w-full border-t" style="border-color: #e0e0e0">
      <div class="text-center text-gray-400 text-xs py-6">
        © 2024 MyJob - Job Portal. All rights Reserved
      </div>
    </footer>
  </body>
</html>
