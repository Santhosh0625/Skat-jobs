<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contact</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="absolute top-4 right-4 w-72 mr-40">
      <div class="flex justify-between text-sm font-medium text-gray-500 mb-1">
        <span>Setup Progress</span>
        <span class="text-[#0066FF]">75% Completed</span>
      </div>
      <progress value="75" max="100" class="w-full h-2 rounded-full"></progress>
    </div>

    <div class="container">
      <header class="header">
        <img
          src="https://img.icons8.com/ios-filled/50/0066FF/briefcase.png"
          alt="Logo"
        />
        <h2 class="text-xl font-bold">SkatJobs</h2>
      </header>
      <div class="contentBody">
        <nav class="nav-tabs">
          <ul>
            <li>
              <a href="index.html"><i class="fas fa-user"></i> Company Info </a>
            </li>
            <li>
              <a href="foundingInfo.html"
                ><i class="fas fa-circle-user"></i> Founding Info</a
              >
            </li>
            <li>
              <a href="socialMediaProfile.html"
                ><i class="fa-solid fa-globe"></i>Social Media Profile</a
              >
            </li>
            <li>
              <a href="contact.html"><i class="fa-solid fa-at"></i>Contact</a>
            </li>
          </ul>
        </nav>
        <div class="hero5 p-6 bg-white space-y-6">
          <!-- Map Location -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Map Location</label
            >
            <input
              type="text"
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Phone -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Phone</label
            >
            <div class="flex items-center gap-2">
              <div
                class="flex items-center border border-gray-300 rounded-md px-3 py-2 bg-white"
              >
                <img
                  src="https://flagcdn.com/w40/bd.png"
                  alt="BD Flag"
                  class="w-5 h-5 mr-2"
                />
                <span class="text-gray-700 text-sm">+880</span>
              </div>
              <input
                type="text"
                placeholder="Phone number.."
                class="flex-1 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
          </div>

          <!-- Email -->

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Email</label
            >
            <div
              class="flex items-center border border-gray-300 rounded-md px-3 py-2"
            >
              <i class="fas fa-envelope text-blue-400 mr-2"></i>
              <input
                type="email"
                placeholder="Email address"
                class="w-full focus:outline-none text-sm"
              />
            </div>
          </div>

          <!-- Buttons -->
          <div class="flex gap-2 mt-4">
            <button
              onclick="window.location.href='socialMediaProfile.html'"
              class="px-4 py-2 border border-gray-300 rounded-md bg-white text-gray-700 hover:bg-gray-100"
            >
              Previous
            </button>
            <button
              onclick="window.location.href='congrats.html'"
              class="px-5 py-2 bg-blue-600 text-white rounded-md flex items-center hover:bg-blue-700"
            >
              Finish Editing
              <i class="fa-solid fa-arrow-right w-4 h-4 ml-3 mt-1"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer class="w-full border-t" style="border-color: #e0e0e0">
      <div class="text-center text-gray-400 text-xs py-6">
        © 2024 MyJob - Job Portal. All rights Reserved
      </div>
    </footer>
  </body>
</html>
